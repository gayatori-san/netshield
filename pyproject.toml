[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netshield"
version = "1.0.0"
description = "NetShield - educational network attack detection system"
requires-python = ">=3.11"
dependencies = ["scapy==2.8.0", "Flask==3.1.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["netshield*"]

[tool.setuptools.package-data]
"netshield.dashboard" = ["templates/*.html", "static/css/*.css", "static/js/*.js", "static/img/*.svg", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:netshield.*", "default"]
